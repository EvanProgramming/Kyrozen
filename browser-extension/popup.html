<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kyrozen</title>
  <style>
    body {
      width: 260px;
      padding: 12px;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      color: #e2e8f0;
      background: #0f172a;
    }
    h1 {
      font-size: 14px;
      margin: 0 0 10px;
      color: #93c5fd;
    }
    .status {
      font-size: 11px;
      color: #94a3b8;
      margin-bottom: 10px;
      min-height: 16px;
    }
    button {
      width: 100%;
      padding: 8px;
      margin-bottom: 8px;
      border: none;
      border-radius: 6px;
      background: #2563eb;
      color: white;
      cursor: pointer;
      font-size: 13px;
    }
    button:hover {
      background: #3b82f6;
    }
    button:disabled {
      background: #334155;
      cursor: not-allowed;
    }
    .hint {
      font-size: 11px;
      color: #64748b;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <h1>Kyrozen Clipper</h1>
  <div id="status" class="status">正在检查连接...</div>
  <button id="send-page" disabled>发送当前页面</button>
  <button id="send-selection" disabled>发送选中内容</button>
  <div class="hint">需要 Kyrozen 桌面端在运行</div>
  <script src="popup.js"></script>
</body>
</html>
