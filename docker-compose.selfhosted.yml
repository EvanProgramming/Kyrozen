version: "3.8"

# Self-hosted Kyrozen backend deployment.
#
# This stack runs the Kyrozen API backend + a local PostgreSQL instance.
# The desktop client connects directly to the backend over HTTPS/WSS.
#
# Quick start:
#   1. Copy .env.example to .env and fill in your Supabase + AI keys.
#   2. Set KYROZEN_DB_BACKEND=postgres and KYROZEN_POSTGRES_DSN.
#   3. (Optional) Place your TLS certificate/key in ./caddy/certs/ or use Caddy's automatic HTTPS.
#   4. docker compose -f docker-compose.selfhosted.yml up -d --build

services:
  kyrozen-postgres:
    image: postgres:16-alpine
    container_name: kyrozen-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kyrozen}
      POSTGRES_USER: ${POSTGRES_USER:-kyrozen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - kyrozen_postgres_data:/var/lib/postgresql/data
    networks:
      - kyrozen-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kyrozen} -d ${POSTGRES_DB:-kyrozen}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  kyrozen-backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: kyrozen-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - KYROZEN_HOST=0.0.0.0
      - KYROZEN_PORT=8000
      - KYROZEN_DB_BACKEND=postgres
      - KYROZEN_POSTGRES_DSN=postgresql://${POSTGRES_USER:-kyrozen}:${POSTGRES_PASSWORD}@kyrozen-postgres:5432/${POSTGRES_DB:-kyrozen}
      - KYROZEN_WORKSPACE_ROOT=/app/workspace
    volumes:
      - kyrozen_workspace:/app/workspace
    networks:
      - kyrozen-network
    depends_on:
      kyrozen-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M

  caddy:
    image: caddy:2-alpine
    container_name: kyrozen-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - kyrozen-network
    depends_on:
      - kyrozen-backend
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

volumes:
  kyrozen_workspace:
    driver: local
  kyrozen_postgres_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local

networks:
  kyrozen-network:
    driver: bridge
